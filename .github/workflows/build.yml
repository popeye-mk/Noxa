name: Build APK

# Builds the debug APK on every push / PR and runs the packet-algorithm
# cross-checks. Download the APK from the run's "Artifacts" section.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - name: Packet-algorithm checks
        run: python3 build-tools/test_packets.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # MIT-licensed open-source caching only — no proprietary components
          # in Noxa's build (v6 defaults to a closed-source cache provider).
          cache-provider: basic

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: noxa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
