name: Build APK

# Builds the TEST APK ("Noxa TEST", installs side-by-side) on every push / PR
# and runs the unit tests + packet-algorithm cross-checks. Download it from
# the run's "Artifacts" section. Public releases: see release.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - name: Packet-algorithm checks
        run: python3 build-tools/test_packets.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # MIT-licensed open-source caching only — no proprietary components
          # in Noxa's build (v6 defaults to a closed-source cache provider).
          cache-provider: basic

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # A plain .apk (not a zip) so it can be tapped and installed straight
      # from a phone. archive:false names the artifact after the file.
      - name: Name the test APK
        run: cp app/build/outputs/apk/debug/app-debug.apk noxa-TEST.apk

      - uses: actions/upload-artifact@v7
        with:
          path: noxa-TEST.apk
          archive: false
          if-no-files-found: error
