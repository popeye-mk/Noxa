name: Build APK

# Builds the debug APK on every push / PR and runs the packet-algorithm
# cross-checks. Download the APK from the run's "Artifacts" section.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Packet-algorithm checks
        run: python3 build-tools/test_packets.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: noxa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
