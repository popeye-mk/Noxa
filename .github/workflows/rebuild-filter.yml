name: Rebuild blocklist

# Weekly: download every source list, rebuild the compiled filter, verify it
# strictly, and — only on main — commit it. Phones already check this repo
# daily (FilterUpdater) and swap a newer list in live, so users get fresh
# protection every week with zero manual work and no server of our own.
#
# On any other branch it's a DRY RUN: same build + checks, the result is
# uploaded as an artifact, nothing committed. On main every trigger commits —
# including a merge that touches the build tools, so a fix ships at once.
on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "build-tools/**"
      - ".github/workflows/rebuild-filter.yml"

permissions:
  contents: read

concurrency:
  group: rebuild-filter-${{ github.ref }}
  cancel-in-progress: false

# Two jobs (audit of 26 Oct): "rebuild" handles everything downloaded from third parties (the source lists, the
# UT1 tarball) with a read-only token; "publish" only copies the verified files in and commits them. A poisoned
# download can then no longer reach a write token. Actions are pinned to commits.
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download source lists
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}   # optional, for URLhaus
        run: bash build-tools/fetch_sources.sh

      - name: Build filter
        run: python3 build-tools/build_blocklist.py

      - name: Verify (refuses to ship on any failure)
        run: python3 build-tools/verify_build.py

      - name: Ad-block test score must not drop (adblock.turtlecute.org hosts)
        shell: bash   # = bash -eo pipefail, so the tee can't hide a failure
        run: >
          python3 build-tools/test_site_coverage.py --compare
          app/src/main/assets/guardian-default.gbf build-tools/out/guardian-default.gbf
          | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cross-check Kotlin hashing math
        working-directory: build-tools
        run: python3 verify_kotlin_math.py

      - name: Did the filter change?
        id: stage
        run: |
          if cmp -s build-tools/out/guardian-default.gbf app/src/main/assets/guardian-default.gbf; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Filter unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "### New filter" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json;m=json.load(open('build-tools/out/manifest.json'));print(f\"{m['unique_domains']:,} domains, built {m['built_at']} UTC\")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rebuilt-filter
          path: |
            build-tools/out/guardian-default.gbf
            build-tools/out/manifest.json
            build-tools/out/build-report.txt
            build-tools/out/stalkerware.txt
            build-tools/out/threats.gbf
            build-tools/out/risky-tlds.txt
            build-tools/out/family.gbf
          if-no-files-found: warn

  publish:
    needs: rebuild
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # commit the verified filter, publish the family filter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rebuilt-filter
          path: build-tools/out

      - name: Stage into the app
        run: |
          cp build-tools/out/guardian-default.gbf app/src/main/assets/guardian-default.gbf
          cp build-tools/out/manifest.json app/src/main/assets/blocklist-manifest.json
          cp build-tools/out/stalkerware.txt app/src/main/assets/stalkerware.txt
          cp build-tools/out/threats.gbf app/src/main/assets/threats.gbf
          # optional (strict mode): only replaced when this week's download worked
          if [ -s build-tools/out/risky-tlds.txt ]; then
            cp build-tools/out/risky-tlds.txt app/src/main/assets/risky-tlds.txt
          fi

      - name: Commit (main only)
        if: needs.rebuild.outputs.changed == 'true'
        run: |
          git config user.name "noxa-filter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/guardian-default.gbf app/src/main/assets/blocklist-manifest.json app/src/main/assets/stalkerware.txt app/src/main/assets/threats.gbf app/src/main/assets/risky-tlds.txt
          git commit -m "Weekly blocklist rebuild ($(date -u +%Y-%m-%d))"
          git push

      # v1.14 family filter: ~10 MB, so it rides on a rolling release asset instead of a weekly
      # commit. The app downloads it only when a parent switches the Family filter on, and checks
      # it against family_sha256 in the manifest committed above. Marked not-latest + prerelease so
      # the app's "new version" notice never points at it.
      - name: Publish the family filter (main only, release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view family-filter >/dev/null 2>&1 || gh release create family-filter \
            --title "Family filter (rolling, not an app release)" --prerelease --latest=false \
            --notes "The optional family filter (adult, gambling, dating categories), rebuilt weekly. Noxa downloads it by itself when the Family filter is switched on. Not an app release."
          gh release upload family-filter build-tools/out/family.gbf --clobber
